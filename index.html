<title>Seberapa FOMO Lu Beli iPhone 18 Pro?</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--mut:#8e8e93;--acc:#007aff;--sep:rgba(60,60,67,.18);--track:rgba(118,118,128,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#fff;--acc:#0a84ff;--sep:rgba(84,84,88,.6);--track:rgba(118,118,128,.36)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#fff;--acc:#0a84ff;--sep:rgba(84,84,88,.6);--track:rgba(118,118,128,.36)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px 40px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:440px}
h1{font-size:2rem;font-weight:700;letter-spacing:-.03em;margin:8px 4px 4px;line-height:1.15}
.sub{color:var(--mut);margin:0 4px 22px}
.top{display:flex;justify-content:space-between;align-items:center;height:28px;margin:0 4px 8px;color:var(--mut);font-size:.85rem}
.top button{background:none;border:0;color:var(--acc);font-size:1rem;padding:0;cursor:pointer;font-family:inherit}
.bar{height:4px;background:var(--track);border-radius:2px;margin:0 4px 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.q{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:0 4px 16px;line-height:1.25}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--card);color:var(--text);font:inherit;font-size:1.02rem;text-align:left;padding:15px 16px;cursor:pointer}
.opt+.opt{box-shadow:inset 0 .5px 0 var(--sep)}
.opt::after{content:"\203A";color:var(--mut);font-size:1.4rem;line-height:1}
.opt:active,.opt.sel{background:var(--track)}
.start{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-size:1.06rem;font-weight:600;padding:15px;cursor:pointer;margin-top:8px}
.start:active{opacity:.75}
.fade{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.res{background:var(--card);border-radius:20px;padding:22px 20px 24px;text-align:center}
.gauge{width:100%;max-width:320px;margin:0 auto}
.needle{transform-origin:120px 120px;transform:rotate(-90deg);transition:transform 1.8s cubic-bezier(.2,1.25,.4,1)}
.num{font-size:2.8rem;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:-6px}
.lvl{font-size:1.1rem;font-weight:600;margin:6px 0 2px}
.badge{display:inline-block;font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:99px;margin:10px 0 12px}
.msg{font-size:1.02rem;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin:0}
.puja{background:rgba(52,199,89,.16);color:#248a3d}.roast{background:rgba(255,59,48,.14);color:#d70015}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .puja{color:#30d158}:root:not([data-theme="light"]) .roast{color:#ff6961}}
:root[data-theme="dark"] .puja{color:#30d158}:root[data-theme="dark"] .roast{color:#ff6961}
.again{margin-top:14px}
.scene{height:340px;perspective:1000px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;margin-top:-4px}
.scene:active{cursor:grabbing}
.phone{--c1:#4f1a28;--c2:#74303f;position:relative;width:150px;height:318px;transform-style:preserve-3d;transform:rotateX(-8deg) rotateY(-25deg)}
.phone>*{position:absolute;inset:0;border-radius:30px}
.sl{background:var(--c1)}
.fr,.bk{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fr{transform:translateZ(7px);background:#000;padding:4px;box-shadow:inset 0 0 0 2px var(--c1)}
.scr{width:100%;height:100%;border-radius:27px;background:linear-gradient(180deg,#3a0f1a,#5c1e2d);position:relative;overflow:hidden;color:#fff;text-align:center}
.isl{position:absolute;top:9px;left:50%;width:44px;height:13px;border-radius:9px;background:#000;transform:translateX(-50%)}
.dt{position:absolute;top:40px;width:100%;font-size:.8rem;font-weight:600;opacity:.92}
.clk{position:absolute;top:56px;width:100%;font-size:2.6rem;font-weight:700;letter-spacing:-.04em}
.tg{position:absolute;bottom:24px;width:100%;font-size:.8rem;opacity:.92}
.bk{transform:translateZ(-7px) rotateY(180deg);background:linear-gradient(145deg,var(--c2),var(--c1))}
.wp{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 3px rgba(255,140,170,.8))}
.scr>div{z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.35)}

function spin(){var ph=document.getElementById("ph");if(!ph){loop=false;return}

ph.style.transform="rotateX("+rx+"deg) rotateY("+ry+"deg)";requestAnimationFrame(spin)}
function bind(){var sc=document.getElementById("sc"),ph=document.getElementById("ph");
sc.onpointerdown=function(e){drag=true;lx=e.clientX;ly=e.clientY;vx=vy=0;try{sc.setPointerCapture(e.pointerId)}catch(x){}};
sc.onpointermove=function(e){if(!drag)return;vx=(e.clientX-lx)*.6;vy=-(e.clientY-ly)*.4;ry+=vx;rx+=vy;lx=e.clientX;ly=e.clientY;idle=Date.now()};
sc.onpointerup=sc.onpointercancel=function(){drag=false;idle=Date.now()};

b+=Math.random()*8-4;return Math.max(0,Math.min(100,Math.round(b)))}

var h='<div class="tips fade"><h2>Biar nggak kemakan gengsi</h2><div class="group">';

h+=r('Nabung dulu, baru checkout','Sisihin 20-30% tiap gajian ke rekening terpisah, kalau bisa otomatis. Itung kasar: nabung 20% dari gaji, lu butuh sekitar '+w+' buat ngumpulin iPhone 18 Pro 256 GB (Rp 27.499.000). Versi Pro Max biasanya lebih mahal lagi.');
h+=r('Amanin dana darurat dulu','Minimal 3 bulan pengeluaran. HP itu keinginan, dana darurat itu kebutuhan.');
h+=r('Jurus tahan 30 hari','Pengen banget? Tahan sebulan. Kalau masih pengen, berarti itu bukan sekadar FOMO.');
h+=r('Kalau terpaksa nyicil','Patokan umum, total cicilan nggak lebih dari 30% penghasilan. Jangan pernah pinjol ilegal, pastiin yang berizin OJK.');
return h+'</div><p class="note">Panduan umum, bukan saran keuangan profesional. Harga acuan bisa berubah.</p></div>'}

if(idx[3]==0){

}else{

h+=R('Kapasitas nabung lu','Dari gaji dan sisa duit lu, kira-kira '+rp(cap)+' per bulan. Kalau semuanya buat iPhone 18 Pro 256 GB (Rp 27.499.000), kekumpul sekitar '+w+'.');
if(d<=1){h+=R('Prioritas: dana darurat','Kumpulin '+(d==0?'dari nol sampai':'sampai')+' 3-6 bulan pengeluaran dulu, pilih yang gampang dicairin dan risikonya rendah.');
h+=A('Reksa dana pasar uang',60,'Likuid dan risikonya relatif rendah.')+A('Tabungan atau deposito',40,'Aman buat dana yang harus siap dipake.');apps=[["Bibit","Reksa dana dan SBN, ramah buat pemula."],["Bareksa","Reksa dana, SBN, dan emas dalam satu aplikasi."]]}
else if(d==2){h+=R('Dana darurat lu hampir aman','Boleh mulai nambah instrumen jangka menengah, sambil tetep jaga dana daruratnya.');
h+=A('Reksa dana pasar uang',30,'Buat dana yang masih butuh likuid.')+A('SBN ritel atau reksa dana pendapatan tetap',40,'Imbal hasil lebih stabil buat jangka menengah.')+A('Emas',30,'Buat lindung nilai jangka panjang.');apps=[["Bibit","Reksa dana dan SBN."],["Bareksa","Reksa dana, SBN, dan emas."],["Pluang","Buat nabung emas."]]}
else{h+=R('Fondasi lu udah kuat','Dana darurat aman, jadi lu bisa mulai porsi yang lebih agresif'+(young?', apalagi umur lu masih panjang buat nunggu hasilnya.':', tapi tetep sesuaikan sama toleransi risiko lu.'));
var s1=young?45:30;h+=A('Reksa dana pasar uang',10+(young?0:5),'Buat dana siap pakai.')+A('SBN atau reksa dana pendapatan tetap',young?25:35,'Penyeimbang risiko.')+A('Emas',20,'Lindung nilai.')+A('Reksa dana indeks atau saham',s1,'Buat jangka panjang, nilainya bisa naik turun.');
apps=[["Bibit","Reksa dana dan SBN."],["Bareksa","Reksa dana, SBN, dan emas."],["Ajaib","Reksa dana dan saham."],["Stockbit","Saham, plus komunitas buat belajar."],["Pluang","Buat nabung emas."]]}
}
h+='</div>';
if(apps.length){h+='<h2 class="h2b">Aplikasi yang bisa lu cek</h2><div class="group">';apps.forEach(function(a){h+=R(a[0],a[1])});h+='</div>'}
return h+'<p class="note">Contoh alokasi, bukan saran investasi atau keuangan profesional. Semua investasi ada risikonya dan nilainya bisa turun. Fitur aplikasi bisa beda dan berubah, cek langsung di aplikasinya dan pastiin berizin OJK.</p></div>'}
function compose(li){var roast=li>=2,ix=ans.map(function(p,k){return[k,p+Math.random()*1.5]});
ix.sort(function(a,b){return roast?b[1]-a[1]:a[1]-b[1]});
var parts=[rnd(OP[li])];
ix.slice(0,2).forEach(function(x){parts.push(rnd(T[x[0]][roast?0:1]).replace("{a}",lab[x[0]]))});
parts.push(rnd(CL[li]));return parts.join(" ")}
function pt(a,r,deg){var t=deg*Math.PI/180;return(120+r*Math.cos(t)).toFixed(1)+" "+(120-r*Math.sin(t)).toFixed(1)}
function arc(s){var a=180-s*45,b=a-45-(s<3?1.5:0);return"M"+pt(0,90,a)+" A90 90 0 0 1 "+pt(0,90,b)}
function home(){
i=-1;ans=[];lab=[];idx=[];
app.innerHTML='<div class="fade">'+phoneHTML()+'<h1>Seberapa FOMO lu beli iPhone 18 Pro?</h1><p class="sub">Jawab '+Q.length+' pertanyaan dengan jujur. Ujungnya cuma dua: dipuja atau di-roasting.</p><button class="start" id="go">Gas mulai</button></div>';
document.getElementById("go").onclick=function(){i=0;show()};
bind();
}
function show(){
var q=Q[i];
var h='<div class="fade"><div class="top"><span>'+(i>0?'<button id="bk">‹ Kembali</button>':'')+'</span><span>'+(i+1)+' dari '+Q.length+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><p class="q">'+q[0]+'</p><div class="group">';
q[1].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+o[0]+'</button>'});
app.innerHTML=h+'</div></div>';
document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
b.classList.add("sel");ans[i]=Q[i][1][+b.dataset.k][1];lab[i]=Q[i][1][+b.dataset.k][0];idx[i]=+b.dataset.k;
setTimeout(function(){i++;i<Q.length?show():result()},170)}});
var bk=document.getElementById("bk");if(bk)bk.onclick=function(){i--;show()};
}
function result(){
var s=score();
var li=s<20?0:s<40?1:s<60?2:s<80?3:4,lv=L[li],m=compose(li);

app.innerHTML='<div class="fade res"><svg class="gauge" viewBox="0 0 240 140" role="img" aria-label="Meteran FOMO">'+segs+ticks+'<text x="20" y="136" font-size="10" fill="var(--mut)" text-anchor="middle">JOMO</text><text x="220" y="136" font-size="10" fill="var(--mut)" text-anchor="middle">FOMO</text><g class="needle" id="nd"><line x1="120" y1="120" x2="120" y2="42" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/></g><circle cx="120" cy="120" r="8" fill="var(--text)"/><circle cx="120" cy="120" r="3" fill="var(--card)"/></svg><div class="num" id="n">0</div><div class="lvl">'+lv[0]+'</div><span class="badge '+lv[1]+'">'+(lv[1]=="puja"?"Dipuja 👏":"Diroasting 🔥")+'</span><p class="msg">'+m+'</p></div>'+tips()+invest()+'<button class="start again" id="re">Ulangi</button>';

function tick(t){if(!t0)t0=t;var p=Math.min((t-t0)/1500,1);n.textContent=Math.round(s*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)}
requestAnimationFrame(tick);
}
